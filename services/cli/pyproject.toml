[project]
name = "terraducktel-cli"
version = "0.1.0"
description = "Command-line client for Terraducktel (TDT)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
tdt = "tdt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdt"]
